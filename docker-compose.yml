services:
  restora:
    build: .
    image: restora:latest
    container_name: restora
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      RESTORA_DATA: /data
      RESTORA_PUBLIC_URL: ${RESTORA_PUBLIC_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ROLES: ${TELEGRAM_CHAT_ROLES:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      RESTORA_TENANT: ${RESTORA_TENANT:-}
      RESTORA_SECURE_COOKIES: ${RESTORA_SECURE_COOKIES:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@restora.io}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-superadmin1234}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      # Optional AI layer — absent AI_API_KEY keeps every /api/ai/* route a no-op.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-}
      AI_GUEST_RATE_LIMIT: ${AI_GUEST_RATE_LIMIT:-}
      AI_RATE_WINDOW_MS: ${AI_RATE_WINDOW_MS:-}
      AI_CACHE_TTL_MS: ${AI_CACHE_TTL_MS:-}
    volumes:
      - restora-data:/data

volumes:
  restora-data:
