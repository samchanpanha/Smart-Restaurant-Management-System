services:
  restora:
    build: .
    image: restora:latest
    container_name: restora
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      RESTORA_DATA: /data
      RESTORA_PUBLIC_URL: ${RESTORA_PUBLIC_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ROLES: ${TELEGRAM_CHAT_ROLES:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      RESTORA_TENANT: ${RESTORA_TENANT:-}
      RESTORA_SECURE_COOKIES: ${RESTORA_SECURE_COOKIES:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
    volumes:
      - restora-data:/data

volumes:
  restora-data:
